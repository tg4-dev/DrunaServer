  /api/v1/invites:
    get:
      description: 'pending: I have not answered and it has not ended. upcoming: not
        ended, and I organize it or have answered. past: ended. Without status: all.'
      parameters:
      - description: pending, upcoming or past
        in: query
        name: status
        type: string
      - description: Page size, 1-100 (default 50)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.InviteListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: List invites I organize or am invited to
      tags:
      - invites
    post:
      consumes:
      - application/json
      description: Every invitee must be an accepted friend, otherwise 400 lists them
        (error.field = "invitees").
      parameters:
      - description: Invite
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.CreateInviteInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Invite'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Invite friends to an event
      tags:
      - invites
  /api/v1/invites/{id}:
    delete:
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Cancel an invite (organizer only)
      tags:
      - invites
    get:
      description: 404 unless I organize it or am invited.
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Invite'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get an invite
      tags:
      - invites
    patch:
      consumes:
      - application/json
      description: Absent fields are unchanged. Changing startTime or endTime resets
        every answer to pending.
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.UpdateInviteInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
