            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Update an invite (organizer only)
      tags:
      - invites
  /api/v1/invites/{id}/respond:
    post:
      consumes:
      - application/json
      description: Invitees only, any number of times. "pending" withdraws the answer.
        The organizer gets 400.
      parameters:
      - description: Invite ID
        in: path
        name: id
        required: true
