  /api/v1/friends/{username}/busy:
    get:
      description: 'Intervals only, no titles: personal and group events, invites
        the friend organizes or accepted. dateFrom/dateTo are RFC3339 or YYYY-MM-DD
        (dateTo inclusive, midnight in timezone). At most 366 days. Non-friends get
        404.'
      parameters:
      - description: Friend's username
        in: path
        name: username
        required: true
        type: string
      - description: RFC3339 or YYYY-MM-DD
        in: query
        name: dateFrom
        required: true
        type: string
      - description: RFC3339 or YYYY-MM-DD (inclusive)
        in: query
        name: dateTo
        required: true
        type: string
      - description: IANA zone for date-only bounds (default UTC)
        in: query
        name: timezone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.FriendBusyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: When an accepted friend is busy
      tags:
      - friends
  /api/v1/friends/accept:
