basePath: /
definitions:
  model.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/model.ErrorBody'
    type: object
  model.AddGroupMemberDoc:
    properties:
      username:
        type: string
    type: object
  model.BusyInterval:
    properties:
      allDay:
        type: boolean
      endTime:
        type: string
      startTime:
        type: string
    type: object
  model.ConfirmGroupTimeDoc:
    properties:
      confirmedTime:
        type: string
    type: object
  model.CreateInviteInput:
    properties:
      allDay:
        type: boolean
      description:
        type: string
      endTime:
        type: string
      invitees:
        items:
          type: string
        type: array
      startTime:
        type: string
      title:
        type: string
    required:
    - endTime
    - invitees
    - startTime
    - title
    type: object
  model.ErrorBody:
    properties:
      code:
        type: integer
      field:
        description: |-
          Field names the request field the error is about, e.g. "username"
          on a 409 from sign-up. Omitted when the error is not about one field.
        type: string
      message:
        type: string
    type: object
  model.Event:
    properties:
      allDay:
        description: |-
          AllDay marks an event shown as a day bar without times. StartTime and
          EndTime still hold the covered interval (midnight to midnight in the
          owner's time zone) and count as busy time.
        type: boolean
      description:
        description: Description is free text up to MaxEventDescriptionLen characters.
        type: string
      endTime:
        type: string
      eventID:
        type: integer
      groupID:
        type: integer
      startTime:
        type: string
      title:
        type: string
      type:
        type: string
      userID:
        type: integer
    required:
    - endTime
    - startTime
    - title
    type: object
  model.FreeTimeInputDoc:
    properties:
      date:
        type: string
      timezone:
        type: string
    type: object
  model.FriendBusyResponse:
    properties:
      busy:
        items:
          $ref: '#/definitions/model.BusyInterval'
        type: array
    type: object
  model.FriendInfo:
    properties:
      avatarColor:
        type: integer
      avatarFont:
        type: string
      avatarURL:
        type: string
      id:
        type: integer
      name:
        type: string
      username:
        type: string
    type: object
  model.FriendRequestDoc:
    properties:
      username:
        type: string
    type: object
  model.Group:
    properties:
      confirmedTime:
        type: string
      groupID:
        type: integer
      name:
        type: string
      ownerID:
        type: integer
    required:
    - name
    type: object
  model.GroupFreeTimeInputDoc:
    properties:
      date:
        type: string
      timezone:
        type: string
    type: object
  model.Invite:
    properties:
      allDay:
        type: boolean
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      id:
        type: integer
      organizer:
        $ref: '#/definitions/model.FriendInfo'
      participants:
        items:
          $ref: '#/definitions/model.InviteParticipant'
        type: array
      startTime:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.InviteListResponse:
    properties:
      invites:
        items:
          $ref: '#/definitions/model.Invite'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.InviteParticipant:
    properties:
      respondedAt:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/model.FriendInfo'
    type: object
  model.RenewTokenDoc:
    properties:
      refreshToken:
        type: string
    type: object
  model.RespondInviteInput:
    properties:
      status:
        enum:
        - going
        - not_going
        - pending
        type: string
    required:
    - status
    type: object
  model.SignInDoc:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.SignUpDoc:
    properties:
      avatarColor:
        description: Optional avatar style chosen during onboarding.
        type: integer
      avatarFont:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  model.UpdateInviteInput:
    properties:
      allDay:
        type: boolean
      description:
        type: string
      endTime:
        type: string
      startTime:
        type: string
      title:
        type: string
    type: object
  model.UpdateProfileInput:
    properties:
      avatarColor:
        type: integer
      avatarFont:
        type: string
      avatarURL:
        type: string
      name:
        type: string
    type: object
  model.UserSearchResult:
    properties:
      avatarColor:
        type: integer
      avatarFont:
        type: string
      avatarURL:
        type: string
      id:
        type: integer
      name:
        type: string
      relation:
        type: string
      username:
        type: string
    type: object
  model.UsernameAvailability:
    properties:
      available:
        type: boolean
      username:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: API server for Druna App
  title: Druna API
  version: "1.0"
paths:
  /api/v1/events/:
    get:
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Event type filter
        in: query
        name: type
        type: string
      - description: RFC3339 lower bound
        in: query
        name: dateFrom
        type: string
      - description: RFC3339 upper bound
        in: query
        name: dateTo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: List events for current user
      tags:
      - events
    post:
      consumes:
      - application/json
      parameters:
      - description: Event payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.Event'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Create event
      tags:
      - events
  /api/v1/events/{id}:
