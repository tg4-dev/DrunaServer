version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: druna_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - druna-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d druna_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: air -c .air.toml
    environment:
      DB_PASSWORD: postgres
      JWT_SECRET: changeme-dev-secret
      BOT_TOKEN: ""
      DATABASE_URL: postgres://postgres:postgres@db:5432/druna_db?sslmode=disable
      CORS_ORIGINS: "*"
      METRICS_ENABLED: "true"
      METRICS_ADDR: 0.0.0.0:9090
    volumes:
      - .:/app
      - ./configs/config.docker.yaml:/app/configs/config.yaml
    ports:
      - "22000:22000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - druna-net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: always
    depends_on:
      - app
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - druna-net

  grafana:
    image: grafana/grafana:11.3.0
    restart: always
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: druna-dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - druna-net

networks:
  druna-net:
